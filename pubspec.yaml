name: kerfplan
description: Offline 1D linear cutting stock planning for Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  uuid: ^4.6.0
  intl: ^0.20.3
  pdf: ^3.13.1
  share_plus: ^13.3.0
  firebase_core: 4.15.0
  firebase_app_check: 0.4.8
  cloud_functions: 6.5.0
  in_app_purchase: 3.3.1
  in_app_purchase_android: 0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
    - assets/fonts/NotoSansMath-Regular.ttf
    - assets/fonts/OFL.txt
